<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>首爾冬旅手帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#7A5B3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="首爾冬旅">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column; espresso-brown type and pins, Han-river blue for actions and routes; fixed bottom tab bar */
:root{
  --paper:#FFF1D9; --card:#FFF8EC; --ink:#3A2A1C; --muted:#7D6750; --line:#EBDCC2;
  --brown:#7A5B3E; --latte:#C9AE8C; --blue:#5A6B7C; --sky:#708090; --onsky:#FFFFFF; --chip:#F5E4C6; --warn:#A5533B; --onaccent:#FFFFFF;
  --c-shop:#727420; --c-move:#2E6E9E; --c-food:#C27A28; --c-med:#A84A6A;
  --sk1:#5F6F80; --sk2:#9AA8B6; --hill1:#56636F; --hill2:#7C8B99; --roofc:#7A5B3E; --snowc:#FFF1D9;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1F1812; --card:#2A2119; --ink:#FFF1D9; --muted:#BCA88F; --line:#3E3226;
  --brown:#C9A27C; --latte:#8E7559; --blue:#A9B6C3; --sky:#8E9DAC; --onsky:#1F1812; --chip:#33281E; --warn:#E08A6E; --onaccent:#1F1812; --c-shop:#8E8C34; --c-move:#3F8AC4; --c-food:#B9802F; --c-med:#BE5C80; --sk1:#232B33; --sk2:#47525E; --hill1:#1E252C; --hill2:#323C46; --roofc:#5E4630; --snowc:#F3E6CF; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#1F1812; --card:#2A2119; --ink:#FFF1D9; --muted:#BCA88F; --line:#3E3226;
  --brown:#C9A27C; --latte:#8E7559; --blue:#A9B6C3; --sky:#8E9DAC; --onsky:#1F1812; --chip:#33281E; --warn:#E08A6E; --onaccent:#1F1812; --c-shop:#8E8C34; --c-move:#3F8AC4; --c-food:#B9802F; --c-med:#BE5C80; --sk1:#232B33; --sk2:#47525E; --hill1:#1E252C; --hill2:#323C46; --roofc:#5E4630; --snowc:#F3E6CF; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
@media (display-mode: standalone){:root{padding-top:env(safe-area-inset-top,0px)}}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

.scene{margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)));overflow:hidden;border-radius:0 0 22px 22px;line-height:0}
.scene svg{display:block;width:100%;height:auto;max-height:200px}
.scene .sk1{stop-color:var(--sk1)}.scene .sk2{stop-color:var(--sk2)}
.scene .moon{fill:var(--snowc);opacity:.85}
.scene .hill2{fill:var(--hill2)}.scene .hill{fill:var(--hill1)}
.scene .tower{fill:var(--hill1)}
.scene .wall{fill:var(--snowc);opacity:.9}.scene .post{fill:var(--roofc)}.scene .win{fill:none;stroke:var(--roofc);stroke-width:1.5}
.scene .roof,.scene .ridge{fill:var(--roofc)}.scene .snow,.scene .ground{fill:var(--snowc)}
.scene .sf{fill:var(--snowc);opacity:.9}
.scene .kr{fill:var(--snowc);font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.2em;opacity:.9}
@media (prefers-reduced-motion:no-preference){.scene .sf{animation:snow 9s linear infinite}.scene .sf2{animation-duration:12s}.scene .sf3{animation-duration:15s}}
@keyframes snow{from{transform:translateY(-30px)}to{transform:translateY(190px)}}
header.hero{padding-block:14px 6px}
.hero h1{font-family:var(--font-display);font-weight:900;font-size:2rem;line-height:1.15;margin:10px 0 4px;letter-spacing:.02em;color:var(--brown);text-wrap:balance}
.hero h1 small{font-family:var(--font-body);font-weight:500;font-size:.95rem;color:var(--blue);letter-spacing:.08em;margin-left:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--muted);font-size:.88rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--ink);font-size:.82rem;font-weight:500}
.pill.blue{background:var(--sky);color:var(--onsky)}
.flights{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.flight{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.flight .lab{font-size:.72rem;letter-spacing:.12em;color:var(--muted)}
.flight .no{font-family:var(--font-mono);font-weight:700;font-size:.95rem;color:var(--blue)}
.flight .tm{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}

.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);padding-block:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.days::-webkit-scrollbar{display:none}
.dbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;text-align:left;cursor:pointer;min-width:66px}
.dbtn .dn{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
.dbtn .dd{font-weight:700;font-size:.92rem}
.dbtn[aria-selected="true"]{background:var(--brown);border-color:var(--brown);color:var(--onaccent)}
.dbtn[aria-selected="true"] .dn{color:var(--onaccent);opacity:.85}

h2.sec{font-family:var(--font-display);font-weight:900;font-size:1.45rem;margin:18px 0 4px;color:var(--brown);text-wrap:balance}
h3{font-size:1.02rem;margin:26px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;color:var(--brown)}
h3 .k{font-size:.7rem;letter-spacing:.14em;color:var(--muted);font-weight:500}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 6px}
.dayhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.dayhead .area{font-family:var(--font-display);font-weight:900;font-size:1.45rem;line-height:1.3;color:var(--brown);text-wrap:balance;margin-top:2px}
.loc{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:0 7px;border-radius:999px;background:var(--chip);color:var(--muted);font-family:var(--font-body);font-size:.74rem}
.loc svg{width:11px;height:11px}
.dayhead .date{font-family:var(--font-mono);color:var(--muted);font-size:.85rem}
.est{font-size:.85rem;color:var(--muted)}
.est b{color:var(--ink);font-family:var(--font-mono)}
.note{border-left:3px solid var(--latte);background:var(--card);padding:10px 12px;border-radius:0 10px 10px 0;font-size:.9rem;margin:10px 0}
.note.warn{border-left-color:var(--warn)}
.small{font-size:.8rem;color:var(--muted)}

.tl{list-style:none;margin:8px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:52px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl>li{display:grid;grid-template-columns:44px 1fr;gap:0 30px;padding:8px 0;position:relative}
.tl>li::after{content:"";position:absolute;left:47px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--k,var(--brown))}
.tl>li>.t{font-family:var(--font-mono);font-size:.78rem;font-weight:700;color:var(--muted);padding-top:3px;text-align:right;font-variant-numeric:tabular-nums}
.tl>li>.c{min-width:0}
.tl .ti{font-weight:700}
.tl .d{color:var(--muted);font-size:.88rem}
.tl>li[data-k="move"]{--k:var(--blue)}
.tl>li[data-k="food"]{--k:var(--warn)}
.tl>li[data-k="cafe"]{--k:var(--latte)}
.tl>li[data-k="shop"]{--k:var(--brown)}
.tl>li[data-k="sight"]{--k:var(--blue)}
.tl>li[data-k="stay"]{--k:var(--ink)}
.slot{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot .picked{font-weight:700;color:var(--brown)}
.slot .empty{font-size:.85rem;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.nav{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--sky);color:var(--onsky);text-decoration:none;font-size:.8rem;font-weight:500;line-height:1.2}
.nav.n{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.nav svg{width:13px;height:13px;flex:none}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;font-size:.85rem;cursor:pointer}

.flist{display:grid;gap:10px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.fcard.on{border-color:var(--brown);box-shadow:0 0 0 1px var(--brown) inset}
.fcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.fcard .nm{font-weight:700;font-size:1rem}
.fcard .cat{font-size:.78rem;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:.68rem;padding:1px 7px;border-radius:6px;background:var(--chip);color:var(--ink);white-space:nowrap}
.tag.ig{background:var(--sky);color:var(--onsky)}
.tag.mine{background:var(--brown);color:var(--onaccent)}
.tag.book{background:transparent;border:1px solid var(--latte);color:var(--muted)}
.fcard .why{font-size:.86rem;color:var(--muted);margin-top:4px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.pk{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:.8rem;cursor:pointer}
.pk[aria-pressed="true"]{background:var(--brown);border-color:var(--brown);color:var(--onaccent)}
.grp{font-size:.78rem;letter-spacing:.1em;color:var(--muted);margin:14px 0 6px}
.filter{display:flex;gap:6px;margin:4px 0 2px}
.filter button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:.8rem;cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--onsky)}

.route{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;margin:10px 0;min-width:0}
.route .rh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.route .rt{font-weight:700;font-size:1.02rem}
.route .rw{font-family:var(--font-mono);font-size:.76rem;color:var(--muted)}
.stops{list-style:none;margin:12px 0 0;padding:0}
.stop{display:grid;grid-template-columns:30px 1fr auto;gap:0 12px;align-items:start}
.stop .num{width:30px;height:30px;border-radius:50%;background:var(--brown);color:var(--onaccent);font-family:var(--font-mono);font-weight:700;font-size:.82rem;display:grid;place-items:center}
.stop.hot .num{background:var(--sky);color:var(--onsky)}
.stop.done .num{background:var(--line);color:var(--muted)}
.stop.sep .num{background:var(--chip);color:var(--muted)}
.stop .body{min-width:0;padding-top:4px}
.stop .sn{font-weight:700;line-height:1.35}
.stop.sep .sn{font-weight:500;color:var(--muted)}
.stop.done .sn{text-decoration:line-through;color:var(--muted)}
.stop .tip{font-size:.82rem;color:var(--muted)}
.stop .warn{font-size:.78rem;color:var(--warn);font-weight:500}
.hotb{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;padding:0 6px;border-radius:5px;background:var(--sky);color:var(--onsky);margin-left:6px;vertical-align:2px}
.stop .act{display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:2px}
.stop .act input{width:20px;height:20px;accent-color:var(--brown);margin:0}
.mini,.mapi{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--sky);color:var(--onsky);text-decoration:none;flex:none}
.mini svg,.mapi svg{width:16px;height:16px}
.walk{display:grid;grid-template-columns:30px 1fr;gap:0 12px;font-size:.74rem;color:var(--muted);min-height:24px}
.walk::before{content:"";justify-self:center;width:0;border-left:2px dashed var(--latte);height:100%}
.walk span{align-self:center;font-family:var(--font-mono)}
.extra{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.84rem;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin:4px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px}

.floors{display:grid;margin-top:8px}
.floor{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.floor:first-child{border-top:0}
.floor .fl{font-family:var(--font-mono);font-weight:700;font-size:1rem;color:var(--blue)}
.floor.star .fl{color:var(--brown)}
.floor .fn{font-weight:700;font-size:.9rem;color:var(--ink)}
.floor .fb{font-size:.84rem;color:var(--muted);min-width:0}
.floor .fb b{color:var(--ink);font-weight:500}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0;min-width:0}
.card h4{margin:0 0 4px;font-size:1.05rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem;margin:8px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.ko{font-size:1.35rem;font-weight:700;line-height:1.35;background:var(--sky);color:var(--onsky);border-radius:10px;padding:10px 12px;margin:8px 0;word-break:keep-all}
.copy{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.8rem;cursor:pointer}

.leg{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.leg:first-of-type{border-top:0}
.mode{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:6px;color:var(--onaccent);background:var(--blue);white-space:nowrap}
.mode.taxi{background:var(--latte)}
.mode.foot{background:var(--brown)}
.leg .fr{font-weight:700}
.leg .x{font-size:.85rem;color:var(--muted)}
.leg .fee{font-family:var(--font-mono);font-size:.82rem}
.daylab{font-family:var(--font-mono);font-size:.78rem;color:var(--blue);font-weight:700;margin-top:14px}

.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.chk li:first-child{border-top:0}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--brown);flex:none}
.chk label{flex:1;min-width:0}
.chk li.done label{color:var(--muted);text-decoration:line-through}
.prog{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--blue)}

.ppl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.pcard .who{font-weight:700;color:var(--brown)}
.big{font-family:var(--font-mono);font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.field label{font-size:.78rem;color:var(--muted)}
.field input,.field select{font:inherit;font-family:var(--font-mono);width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);min-width:0}
.tgl{display:flex;gap:6px;align-items:center;font-size:.82rem;margin-top:8px}
.tgl input{accent-color:var(--brown)}
.tbl{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.74rem;color:var(--muted);font-weight:500;letter-spacing:.06em}
td.m{font-family:var(--font-mono)}
tfoot td{font-weight:700;border-bottom:0}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addrow .full{grid-column:1/-1}
.primary{border:0;background:var(--brown);color:var(--onaccent);padding:10px;border-radius:10px;font-weight:700;cursor:pointer;width:100%}
.exp{list-style:none;margin:8px 0 0;padding:0}
.exp li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.exp li:first-child{border-top:0}
.m{font-family:var(--font-mono)}
.exp .amt{font-family:var(--font-mono);text-align:right;white-space:nowrap}
.del{border:0;background:none;color:var(--warn);cursor:pointer;font-size:.8rem;padding:0 0 0 6px}
.bar{height:8px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue)}
.bar.over i{background:var(--warn)}


.ibtn{border:0;background:none;color:var(--muted);font-size:1rem;line-height:1;padding:2px 6px;cursor:pointer;border-radius:6px;flex:none}
.ibtn.arm{color:var(--warn);font-size:.78rem;border:1px solid var(--warn)}
h3 .ibtn{margin-left:auto;font-size:.95rem}
.inl{display:flex;gap:8px;width:100%}
.inl input{flex:1;min-width:0;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}
.sbtn{border:0;background:var(--brown);color:var(--onaccent);border-radius:9px;padding:0 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.pie{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin-top:10px}
.donut{width:150px;height:150px;display:block}
.pietot{min-width:0}
.lgd{list-style:none;margin:12px 0 6px;padding:0;display:grid;gap:6px}
.lgd li{display:grid;grid-template-columns:14px 1fr auto 40px;gap:8px;align-items:center;font-size:.9rem}
.lgd i,.dot{display:inline-block;width:12px;height:12px;border-radius:3px}
.dot{width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.lgd .small{text-align:right}
.flabel{font-size:.78rem;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 4px;border:1px solid var(--line);border-radius:9px;font-size:.85rem;cursor:pointer;background:var(--paper)}
.seg span i{width:9px;height:9px;border-radius:50%}
.seg input:checked+span{border-color:var(--brown);box-shadow:0 0 0 1px var(--brown) inset;font-weight:700}
.seg input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.settle{font-size:1rem}
.primary:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:360px){.pie{grid-template-columns:1fr}.donut{margin:0 auto}}

.chk li.witem{align-items:center}
.thumbb{border:0;padding:0;background:none;cursor:zoom-in;flex:none;border-radius:10px}
.thumb{display:block;width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.addph{width:56px;height:56px;border:1px dashed var(--latte);border-radius:10px;display:grid;place-items:center;font-size:.72rem;color:var(--muted);cursor:pointer;flex:none;text-align:center;line-height:1.2}

function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const M=480,k=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72))};im.src=r.result};r.readAsDataURL(file)})}

/* ---------- money ---------- */
function owedOf(e,who){return e.split==='both'?e.twd/2:(e.split===who?e.twd:0)}
function donut(parts,total){
 const R=70,r=46,cx=90,cy=90;let a0=-Math.PI/2;const gap=total?0.02:0;
 if(!total)return `<svg viewBox="0 0 180 180" class="donut" role="img" aria-label="還沒有花費"><circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="var(--chip)" stroke-width="${R-r}"/></svg>`;
 const nz=parts.filter(p=>p.v>0);
 let s=`<svg viewBox="0 0 180 180" class="donut" role="img" aria-label="花費分類圓餅圖">`;
 nz.forEach(p=>{const ang=p.v/total*Math.PI*2;
  if(nz.length===1){s+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="var(--${p.k})" stroke-width="${R-r}"><title>${p.l} NT$${Math.round(p.v).toLocaleString()}</title></circle>`;return}
  const g=Math.min(gap,ang/4);const a1=a0+g/2,a2=a0+ang-g/2;const large=(a2-a1)>Math.PI?1:0;
  const P=(rad,a)=>`${(cx+rad*Math.cos(a)).toFixed(2)} ${(cy+rad*Math.sin(a)).toFixed(2)}`;
  s+=`<path d="M${P(R,a1)} A${R} ${R} 0 ${large} 1 ${P(R,a2)} L${P(r,a2)} A${r} ${r} 0 ${large} 0 ${P(r,a1)} Z" fill="var(--${p.k})"><title>${p.l} NT$${Math.round(p.v).toLocaleString()}（${Math.round(p.v/total*100)}%）</title></path>`;
  a0+=ang});
 return s+`</svg>`;
}

  ${total?`<div class="bar${mySpent>total?' over':''}" style="margin-top:10px"><i style="width:${pc}%"></i></div><div class="small">已花 NT$${fmt(mySpent)}，還剩 <b class="m" style="color:${left<0?'var(--warn)':'var(--brown)'}">NT$${fmt(left)}</b>（≈ ₩${fmt(left*r)}）</div>`:''}</div>
 <h3>誰要給誰</h3><div class="card">${settle}
  <div class="small" style="margin-top:6px">${esc(N.a)} 付了 NT$${fmt(paid.a)}，該出 NT$${fmt(owe.a)}；${esc(N.b)} 付了 NT$${fmt(paid.b)}，該出 NT$${fmt(owe.b)}</div></div>
 <h3>記一筆</h3><div class="card"><form id="expForm" class="addrow">
  <div class="field"><label for="eAmt">金額</label><input id="eAmt" type="number" inputmode="decimal" placeholder="例如 12000" required></div>

  <div class="field"><label for="ePayer">誰付的</label><select id="ePayer"><option value="a" ${me==='a'?'selected':''}>${esc(N.a)}</option><option value="b" ${me==='b'?'selected':''}>${esc(N.b)}</option></select></div>
  <div class="field"><label for="eSplit">算誰的</label><select id="eSplit"><option value="both">兩人平分</option><option value="a">只算 ${esc(N.a)}</option><option value="b">只算 ${esc(N.b)}</option></select></div>
  <div class="field"><label for="eDay">日期</label><select id="eDay">${D.map(d=>`<option value="${d.id}" ${d.id===curDay?'selected':''}>${d.date}（${d.wd}）</option>`).join('')}</select></div>

  <div class="full"><button class="primary" type="submit" ${ST.ro?'disabled':''}>記一筆</button></div></form></div>
 <h3>紀錄</h3>`+
 (byDay.length?byDay.map(({d,list})=>`<div class="card" style="padding-block:8px"><div class="small" style="display:flex;justify-content:space-between;gap:8px"><span>${d.date}（${d.wd}）${esc(d.area)}</span><span class="m">NT$${fmt(list.reduce((a,x)=>a+x.twd,0))}</span></div><ul class="exp">${list.map(x=>`<li><div style="min-width:0"><div><i class="dot" style="background:var(--c-${x.cat})"></i>${CATN[x.cat]||''} · ${esc(x.note||'未填')}</div><div class="small">${esc(N[x.payer]||'')} 付 · ${x.split==='both'?'兩人平分':'只算 '+esc(N[x.split]||'')}</div></div><div class="amt">₩${fmt(x.krw)}<br><span class="small">NT$${fmt(x.twd)}</span>${ST.ro?'':`<button class="del" data-del="${x.id}" aria-label="刪除">刪除</button>`}</div></li>`).join('')}</ul></div>`).join('')
